[project]
name = "asr-transcript-combination"
version = "0.1.0"
description = "Word-level combination of alternative speech-recognition transcripts"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.3",
    "rapidfuzz>=3.14.6",
    "scipy>=1.18.1",
    "scikit-learn>=1.9.1",
    "whisper-normalizer>=0.1.15",
]

[dependency-groups]
campaign = [
    "matplotlib>=3.11.2",
    "pandas>=3.0.6",
    "pyarrow>=25.0.1",
]

[tool.uv]
package = false
